<article class="movie-card text-center p-1 h-100 position-relative">
  <div class="poster-container mb-1" (click)="openUrl(task().url)" style="cursor: pointer;">
    <img [src]="task().posterUrl" alt="{{ task().title }} poster" class="img-fluid rounded shadow-sm" style="aspect-ratio: 2/3; object-fit: cover; width: 100%;"/>
  </div>
  <div (click)="openUrl(task().url)" style="cursor: pointer;">
    <div class="movie-title text-truncate text-white fw-bold small" [title]="task().title">{{ task().title }}</div>
    <div class="movie-year text-muted" style="font-size: 0.75rem;">{{ task().year }}</div>
  </div>
  @if(isAdmin) {
    <button type="button" class="btn-delete-overlay" aria-label="Delete" (click)="onRemoveTaskClick(task().id); $event.stopPropagation()">
      &times;
    </button>
  }
</article>
